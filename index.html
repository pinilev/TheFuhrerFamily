        // הפעלת הורדת קובץ בדפדפן
        function triggerFileDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // ניקוי תגיות HTML מתוך מחרוזות מיקום/תאריכים בעת ייצוא
        function stripHtmlTags(str) {
            if (!str) return "";
            return str.replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
        }

        // ייצוא כל העץ לקובץ JSON מסודר
        function exportFamilyTreeAsJson() {
            const stats = calculateStats(rawFamilyData);
            const cleanClone = (node) => {
                const item = {
                    id: node.id,
                    name: node.name,
                    gen: node.gen,
                    genLabel: node.gen === 0 ? "שורש" : `דור ${getHebrewGen(node.gen)}`
                };
                if (node.dates) item.dates = stripHtmlTags(node.dates);
                if (node.location) item.location = stripHtmlTags(node.location);
                if (node.children && node.children.length > 0) {
                    item.children = node.children.map(cleanClone);
                }
                return item;
            };

            const exportPayload = {
                title: "אילן היוחסין של משפחת פירר",
                exportedAt: new Date().toISOString(),
                totalHouseholdsOrIndividuals: stats.totalDescendants,
                generationBreakdown: stats.genCounts,
                tree: cleanClone(rawFamilyData)
            };

            const dateStamp = new Date().toISOString().slice(0, 10);
            const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: "application/json;charset=utf-8" });
            triggerFileDownload(blob, `fuhrer-family-tree-${dateStamp}.json`);
        }

        // ייצוא כל העץ לטבלת CSV שטוחה ומסודרת (כולל קשרי הורה-ילד, ענף, תאריכים ומיקומים)
        function exportFamilyTreeAsCsv() {
            const rows = [];
            const headers = [
                "מזהה (ID)",
                "מזהה הורה (Parent ID)",
                "דור",
                "ענף ראשי",
                "שם / זוג",
                "הורים ישירים",
                "תאריכים",
                "מקומות מגורים / אירועים",
                "מספר ילדים ישירים"
            ];

            function traverse(node, parentId = "", parentName = "", branchName = "") {
                const currentBranch = node.gen === 1
                    ? node.name.replace(/^\d+\.\s*/, "").trim()
                    : branchName;

                rows.push([
                    node.id,
                    parentId,
                    node.gen === 0 ? "שורש (0)" : `דור ${getHebrewGen(node.gen)} (${node.gen})`,
                    node.gen === 0 ? "שורש המשפחה" : currentBranch,
                    stripHtmlTags(node.name),
                    stripHtmlTags(parentName),
                    stripHtmlTags(node.dates || ""),
                    stripHtmlTags(node.location || ""),
                    node.children ? node.children.length : 0
                ]);

                if (node.children && node.children.length > 0) {
                    for (const child of node.children) {
                        traverse(child, node.id, node.name, currentBranch);
                    }
                }
            }

            traverse(rawFamilyData);

            const escapeCsvCell = (val) => {
                const str = String(val ?? "");
                if (/[",\r\n]/.test(str)) {
                    return `"${str.replace(/"/g, '""')}"`;
                }
                return str;
            };

            const csvLines = [
                headers.map(escapeCsvCell).join(","),
                ...rows.map(row => row.map(escapeCsvCell).join(","))
            ].join("\r\n");

            // הוספת UTF-8 BOM כדי ש-Excel ותוכנות גנאלוגיה יזהו עברית אוטומטית ללא ג'יבריש
            const bom = "\uFEFF";
            const dateStamp = new Date().toISOString().slice(0, 10);
            const blob = new Blob([bom + csvLines], { type: "text/csv;charset=utf-8;" });
            triggerFileDownload(blob, `fuhrer-family-tree-${dateStamp}.csv`);
        }

        window.addEventListener("DOMContentLoaded", async () => {
            // ניסיון לטעון נתונים מקובץ data.json חיצוני (אם קיים בתיקייה), אחרת שימוש בשכבת הנתונים המובנית
            await tryLoadExternalJsonData();

            const branchFilterAllOption = document.querySelector('#branchFilter option[value="all"]');
            if (branchFilterAllOption && rawFamilyData.children) {
                branchFilterAllOption.textContent = `כל הענפים (${rawFamilyData.children.length} ענפים)`;
            }

            initInitialState(rawFamilyData);
            updateStatsBar(rawFamilyData);
            setupBranchFilter();
            setupSearch();
            applyFiltersAndRender();

            const bannerResetBtn = document.getElementById("bannerResetBtn");
            if (bannerResetBtn) {
                bannerResetBtn.addEventListener("click", () => {
                    const searchInput = document.getElementById("searchInput");
                    const clearSearchBtn = document.getElementById("clearSearchBtn");
                    if (searchInput) searchInput.value = "";
                    currentSearchQuery = "";
                    if (clearSearchBtn) clearSearchBtn.classList.add("hidden");
                    applyFiltersAndRender();
                });
            }

            const backToTopBtn = document.getElementById("backToTopBtn");
            if (backToTopBtn) {
                window.addEventListener("scroll", () => {
                    if (window.scrollY > 350) {
                        backToTopBtn.classList.remove("hidden");
                    } else {
                        backToTopBtn.classList.add("hidden");
                    }
                }, { passive: true });

                backToTopBtn.addEventListener("click", () => {
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });
            }

            const homeLogoBtn = document.getElementById("homeLogoBtn");
            if (homeLogoBtn) {
                homeLogoBtn.addEventListener("click", () => {
                    const searchInput = document.getElementById("searchInput");
                    const clearSearchBtn = document.getElementById("clearSearchBtn");
                    const branchFilter = document.getElementById("branchFilter");

                    if (searchInput) searchInput.value = "";
                    currentSearchQuery = "";
                    activeGenDepth = null;
                    savedExpandedStateBeforeFilter = null;
                    savedToldotStateBeforeFilter = null;
                    if (clearSearchBtn) clearSearchBtn.classList.add("hidden");
                    if (branchFilter) {
                        branchFilter.value = "all";
                    }
                    isToldotExpanded = false;

                    applyFiltersAndRender();
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });
            }

            const printTreeBtn = document.getElementById("printTreeBtn");
            if (printTreeBtn) {
                printTreeBtn.addEventListener("click", openPrintWindow);
            }

            const totalDescendantsBtn = document.getElementById("totalDescendants");
            if (totalDescendantsBtn) {
                totalDescendantsBtn.addEventListener("click", () => {
                    const searchInput = document.getElementById("searchInput");
                    const clearSearchBtn = document.getElementById("clearSearchBtn");
                    const branchFilter = document.getElementById("branchFilter");

                    if (searchInput) searchInput.value = "";
                    currentSearchQuery = "";
                    activeGenDepth = null;
                    savedExpandedStateBeforeFilter = null;
                    savedToldotStateBeforeFilter = null;
                    if (clearSearchBtn) clearSearchBtn.classList.add("hidden");
                    if (branchFilter) branchFilter.value = "all";

                    applyFiltersAndRender();
                });
            }

            // קיצורי מקלדת שימושיים: "/" להתמקדות בחיפוש, "Escape" לניקוי החיפוש או סגירת חלוניות
            document.addEventListener("keydown", (e) => {
                if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
                    e.preventDefault();
                    const searchInput = document.getElementById("searchInput");
                    if (searchInput) searchInput.focus();
                } else if (e.key === "Escape") {
                    const portraitModal = document.getElementById("portraitModal");
                    if (portraitModal) {
                        portraitModal.remove();
                        return;
                    }
                    const searchInput = document.getElementById("searchInput");
                    if (searchInput && searchInput.value.trim() !== "") {
                        searchInput.value = "";
                        currentSearchQuery = "";
                        const clearSearchBtn = document.getElementById("clearSearchBtn");
                        if (clearSearchBtn) clearSearchBtn.classList.add("hidden");
                        applyFiltersAndRender();
                    }
                }
            });

            // חיבור כפתורי הייצוא (JSON / CSV) בפוטר
            const exportJsonBtn = document.getElementById("exportJsonBtn");
            if (exportJsonBtn) {
                exportJsonBtn.addEventListener("click", exportFamilyTreeAsJson);
            }

            const exportCsvBtn = document.getElementById("exportCsvBtn");
            if (exportCsvBtn) {
                exportCsvBtn.addEventListener("click", exportFamilyTreeAsCsv);
            }

            // חיבור כפתור החלפת השפה (עברית / English)
            const langToggleBtn = document.getElementById("langToggleBtn");
            if (langToggleBtn) {
                langToggleBtn.addEventListener("click", toggleLanguage);
            }
        });
    </script>
