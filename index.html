            if (viewListBtn && viewFlowBtn) {
                if (currentViewMode === "list") {
                    viewListBtn.className = "px-2.5 py-1 text-xs sm:text-sm font-bold rounded bg-white text-slate-900 shadow-2xs flex items-center gap-1.5 transition cursor-pointer";
                    viewFlowBtn.className = "px-2.5 py-1 text-xs sm:text-sm font-semibold rounded text-slate-600 hover:text-slate-900 flex items-center gap-1.5 transition cursor-pointer";
                } else {
                    viewFlowBtn.className = "px-2.5 py-1 text-xs sm:text-sm font-bold rounded bg-white text-emerald-900 shadow-2xs flex items-center gap-1.5 transition cursor-pointer";
                    viewListBtn.className = "px-2.5 py-1 text-xs sm:text-sm font-semibold rounded text-slate-600 hover:text-slate-900 flex items-center gap-1.5 transition cursor-pointer";
                }
            }

            applyFiltersAndRender("keep");
        }

        function wrapSvgLines(text, maxCharsPerLine, maxLines = 2) {
            if (!text) return [];
            const words = text.split(/\s+/).filter(Boolean);
            const lines = [];
            let current = "";

            for (const word of words) {
                const candidate = current ? `${current} ${word}` : word;
                if (candidate.length <= maxCharsPerLine) {
                    current = candidate;
                } else {
                    if (current) lines.push(current);
                    current = word;
                    if (lines.length >= maxLines) break;
                }
            }
            if (current && lines.length < maxLines) {
                lines.push(current);
            } else if (current && lines.length === maxLines) {
                const last = lines[maxLines - 1];
                if (last.length > maxCharsPerLine - 2) {
                    lines[maxLines - 1] = last.slice(0, maxCharsPerLine - 1) + "…";
                } else if (!last.endsWith("…")) {
                    lines[maxLines - 1] = last + "…";
                }
            }
            return lines;
        }

        function extractShortYearsLabel(datesStr) {
            if (!datesStr) return "";
            const years = datesStr.match(/\b(18\d{2}|19\d{2}|20\d{2})\b/g);
            if (!years || years.length === 0) return "";
            if (years.length === 1) return years[0];
            const first = years[0];
            const second = years[1];
            return first === second ? first : `${first}–${second}`;
        }

        function applyFlowTransform() {
            const stage = document.getElementById("flowchartStage");
            const zoomLabel = document.getElementById("flowZoomLevel");
            if (stage) {
                stage.setAttribute("transform", `translate(${flowViewportState.x}, ${flowViewportState.y}) scale(${flowViewportState.scale})`);
            }
            if (zoomLabel) {
                zoomLabel.textContent = `${Math.round(flowViewportState.scale * 100)}%`;
            }
        }

        function fitFlowchartToViewport() {
            const viewport = document.getElementById("flowchartViewport");
            if (!viewport) return;
            const rect = viewport.getBoundingClientRect();
            const vw = rect.width || 900;
            const vh = rect.height || 560;
            const cw = flowViewportState.contentWidth || 800;
            const ch = flowViewportState.contentHeight || 400;

            const padX = 48;
            const padTop = 64;
            const padBottom = 36;
            const scaleX = (vw - padX * 2) / cw;
            const scaleY = (vh - padTop - padBottom) / ch;
            const targetScale = Math.max(0.28, Math.min(1.05, Math.min(scaleX, scaleY)));

            flowViewportState.scale = targetScale;
            flowViewportState.x = Math.round((vw - cw * targetScale) / 2);
            flowViewportState.y = Math.round(padTop + Math.max(0, (vh - padTop - padBottom - ch * targetScale) / 2));
            applyFlowTransform();
        }

        function zoomFlowchart(factor) {
            const viewport = document.getElementById("flowchartViewport");
            if (!viewport) return;
            const rect = viewport.getBoundingClientRect();
            const cx = (rect.width || 800) / 2;
            const cy = (rect.height || 500) / 2;

            const oldScale = flowViewportState.scale;
            const newScale = Math.max(0.2, Math.min(2.2, oldScale * factor));
            const ratio = newScale / oldScale;

            flowViewportState.x = cx - (cx - flowViewportState.x) * ratio;
            flowViewportState.y = cy - (cy - flowViewportState.y) * ratio;
            flowViewportState.scale = newScale;
            applyFlowTransform();
        }

        function areAnyFlowNodesExpanded(node) {
            if (!node || !node.children) return false;
            return node.children.some(c => expandedState[c.id] || areAnyFlowNodesExpanded(c));
        }

        function updateFlowExpandButtonLabel() {
            const btnText = document.getElementById("flowExpandAllBtnText");
            if (!btnText) return;
            const displayed = getCurrentlyDisplayedTree();
            const anyExpanded = areAnyFlowNodesExpanded(displayed);
            btnText.textContent = anyExpanded ? t("flowCollapseAll") : t("flowExpandAll");
        }

        function renderFlowchartWithData(dataNode, forceExpand = false, autoFit = true) {
            const listContainer = document.getElementById("treeContainer");
            const flowWrapper = document.getElementById("flowchartWrapper");
            const stage = document.getElementById("flowchartStage");

            if (listContainer) listContainer.classList.add("hidden");
            renderFlowToldotCard();
            if (flowWrapper) flowWrapper.classList.remove("hidden");
            if (!stage) return;

            const isEn = currentLang === "en";
            const dirAttr = isEn ? "ltr" : "rtl";
            const CARD_W = 246;
            const CARD_H = 108;
            const H_GAP = 28;
            const V_GAP = 58;

            const genStyles = {
                0: { fill: "#fff1f2", stroke: "#881337", badge: "#881337", title: "#881337", leafFill: "#fff1f2" },
                1: { fill: "#ffffff", stroke: "#2563eb", badge: "#2563eb", title: "#0f172a", leafFill: "#f8fafc" },
                2: { fill: "#ffffff", stroke: "#16a34a", badge: "#16a34a", title: "#0f172a", leafFill: "#f8fafc" },
                3: { fill: "#ffffff", stroke: "#d97706", badge: "#d97706", title: "#0f172a", leafFill: "#f8fafc" },
                4: { fill: "#ffffff", stroke: "#9333ea", badge: "#9333ea", title: "#0f172a", leafFill: "#f8fafc" },
                5: { fill: "#ffffff", stroke: "#db2777", badge: "#db2777", title: "#0f172a", leafFill: "#f8fafc" }
            };

            // בניית עץ פריסה (Layout Tree) בהתאם לענפים הפתוחים
            function buildLayoutTree(node) {
                const hasChildren = Array.isArray(node.children) && node.children.length > 0;
                const isExpanded = forceExpand ? true : !!expandedState[node.id];
                const visibleChildren = (hasChildren && isExpanded)
                    ? node.children.map(buildLayoutTree)
                    : [];

                let subtreeWidth = CARD_W;
                if (visibleChildren.length > 0) {
                    const childrenSum = visibleChildren.reduce((acc, c) => acc + c.subtreeWidth, 0);
                    subtreeWidth = Math.max(CARD_W, childrenSum + H_GAP * (visibleChildren.length - 1));
                }

                return {
                    data: node,
                    hasChildren,
                    isExpanded,
                    children: visibleChildren,
                    subtreeWidth,
                    x: 0,
                    y: 0
                };
            }

            const layoutRoot = buildLayoutTree(dataNode);
            let maxDepth = 0;

            // הקצאת קואורדינטות (תומך בכיוון RTL בעברית וב-LTR באנגלית)
            function assignCoords(lNode, leftX, depth) {
                maxDepth = Math.max(maxDepth, depth);
                lNode.x = leftX + (lNode.subtreeWidth - CARD_W) / 2;
                lNode.y = depth * (CARD_H + V_GAP);

                if (lNode.children.length > 0) {
                    const orderedChildren = isEn ? lNode.children : [...lNode.children].reverse();
                    const totalChildrenW = orderedChildren.reduce((acc, c) => acc + c.subtreeWidth, 0) + H_GAP * (orderedChildren.length - 1);
                    let cursorX = leftX + (lNode.subtreeWidth - totalChildrenW) / 2;

                    for (const child of orderedChildren) {
                        assignCoords(child, cursorX, depth + 1);
                        cursorX += child.subtreeWidth + H_GAP;
                    }
                }
            }

            assignCoords(layoutRoot, 0, 0);
            flowViewportState.contentWidth = layoutRoot.subtreeWidth;
            flowViewportState.contentHeight = (maxDepth + 1) * CARD_H + maxDepth * V_GAP + 24;

            const edgesSvg = [];
            const nodesSvg = [];

            function renderLayoutNode(lNode) {
                const node = lNode.data;
                const style = genStyles[node.gen] || genStyles[1];
                const isMatch = currentSearchQuery.trim() !== "" && node.isDirectMatch;
                const isLeaf = !lNode.hasChildren;
                const displayName = getDisplayName(node);
                const formattedFlowName = unboldMaidenNamesInHtml(escapeHtml(displayName));
                const shortYears = extractShortYearsLabel(getDisplayDates(node));
                const shortLoc = stripHtmlTags(getDisplayLocation(node)).split(">")[0].trim();
                const metaLine = [shortYears, shortLoc].filter(Boolean).join(" • ");

                const strokeColor = isMatch ? "#f59e0b" : (isLeaf ? "#94a3b8" : style.stroke);
                const fillColor = isMatch ? "#fef3c7" : (isLeaf ? style.leafFill : style.fill);
                const strokeWidth = isMatch ? 3 : (node.gen === 0 ? 2.5 : (isLeaf ? 1.5 : 2));
                const dashArrayAttr = isLeaf && !isMatch ? 'stroke-dasharray="5,3"' : '';

                const genBadgeText = node.gen > 0 ? getHebrewGen(node.gen) : "★";
                const directCount = lNode.hasChildren ? node.children.length : 0;
                const totalSub = lNode.hasChildren ? countSubtreeDescendants(node) : 0;

                // ציור קווי חיבור אורתוגונליים ("מסילה" אנכית-אופקית-אנכית עם פינות מעוגלות) לצאצאים
                if (lNode.children.length > 0) {
                    const parentBottomX = lNode.x + CARD_W / 2;
                    const parentBottomY = lNode.y + CARD_H + 12;
                    const childTopY = lNode.children[0].y;
                    const railY = parentBottomY + Math.round((childTopY - parentBottomY) * 0.5);
                    const cornerR = 10;

                    // קו אנכי היורד מההורה אל המסילה האופקית
                    edgesSvg.push(
                        `<line x1="${parentBottomX}" y1="${parentBottomY}" x2="${parentBottomX}" y2="${railY}" stroke="#64748b" stroke-width="2" stroke-linecap="round" />`
                    );

                    for (const child of lNode.children) {
                        const childTopX = child.x + CARD_W / 2;
                        const dx = childTopX - parentBottomX;

                        if (Math.abs(dx) < 1) {
                            // ילד יחיד או מרכזי הנמצא בדיוק מתחת להורה
                            edgesSvg.push(
                                `<line x1="${childTopX}" y1="${railY}" x2="${childTopX}" y2="${childTopY}" stroke="#64748b" stroke-width="2" stroke-linecap="round" />`
                            );
                        } else {
                            const dir = dx > 0 ? 1 : -1;
                            const r = Math.min(cornerR, Math.abs(dx) / 2, Math.max(2, childTopY - railY - 2));
                            const pathD = `M ${parentBottomX} ${railY} H ${childTopX - dir * r} Q ${childTopX} ${railY} ${childTopX} ${railY + r} V ${childTopY}`;
                            edgesSvg.push(
                                `<path d="${pathD}" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />`
                            );
                        }
                        renderLayoutNode(child);
                    }
                }

                // תגית תחתונה ברורה: כפתור פתיחה/סגירה לבעלי צאצאים, או תגית "קצה ענף" לצאצא האחרון
                let bottomPillHtml = "";
                if (lNode.hasChildren) {
                    const pillText = lNode.isExpanded
                        ? (isEn ? `− Collapse (${directCount})` : `− כווץ (${directCount})`)
                        : (totalSub > directCount
                            ? (isEn ? `+ ${directCount} children (${totalSub})` : `+ ${directCount} ילדים (${totalSub} צאצאים)`)
                            : (isEn ? `+ ${directCount} ${directCount === 1 ? 'child' : 'children'}` : `+ ${directCount === 1 ? 'ילד/ה 1' : directCount + ' ילדים'}`));
                    const pillClass = lNode.isExpanded
                        ? "bg-slate-200 text-slate-800 border-slate-300"
                        : "bg-emerald-600 text-white border-emerald-700 shadow-2xs";
                    bottomPillHtml = `
                        <div class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold border ${pillClass} whitespace-nowrap">
                            ${escapeHtml(pillText)}
                        </div>
                    `;
                } else {
                    const leafText = isEn ? "End of branch" : "קצה ענף (ללא צאצאים)";
                    bottomPillHtml = `
                        <div class="px-2 py-0.5 rounded-full text-[10.5px] font-semibold bg-slate-100 text-slate-500 border border-slate-200 whitespace-nowrap">
                            ${escapeHtml(leafText)}
                        </div>
                    `;
                }

                // שימוש ב-foreignObject עם HTML/CSS אמיתי מבטיח שבירת שורות תקינה ב-RTL וב-LTR ללא חפיפה עם הקווים או התגיות
                nodesSvg.push(`
                    <g class="flow-node-box ${lNode.hasChildren ? 'is-expandable' : ''}" data-node-id="${escapeHtml(node.id)}" transform="translate(${lNode.x}, ${lNode.y})">
                        <rect x="0" y="0" width="${CARD_W}" height="${CARD_H}" rx="10" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${dashArrayAttr} />
                        <path d="M 10 0.75 H ${CARD_W - 10} Q ${CARD_W - 0.75} 0.75 ${CARD_W - 0.75} 6 H 0.75 Q 0.75 0.75 10 0.75 Z" fill="${isLeaf ? '#94a3b8' : style.stroke}" />
                        <foreignObject x="8" y="8" width="${CARD_W - 16}" height="${CARD_H - 12}">
                            <div xmlns="http://www.w3.org/1999/xhtml" dir="${dirAttr}" style="font-family: 'Assistant', sans-serif; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; box-sizing: border-box;">
                                <div style="display: flex; align-items: flex-start; gap: 6px; min-height: 0;">
                                    <span style="background-color: ${style.badge}; color: #ffffff; font-size: 11px; font-weight: 800; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;">
                                        ${escapeHtml(genBadgeText)}
                                    </span>
                                    <div style="font-size: 13px; font-weight: 800; color: ${style.title}; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;">
                                        ${formattedFlowName}
                                    </div>
                                </div>
                                ${metaLine ? `
                                    <div style="font-size: 11px; font-weight: 600; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline-start: 26px;">
                                        ${escapeHtml(metaLine)}
                                    </div>
                                ` : ''}
                            </div>
                        </foreignObject>
                        <foreignObject x="10" y="${CARD_H - 12}" width="${CARD_W - 20}" height="24">
                            <div xmlns="http://www.w3.org/1999/xhtml" dir="${dirAttr}" style="font-family: 'Assistant', sans-serif; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                                ${bottomPillHtml}
                            </div>
                        </foreignObject>
                    </g>
                `);
            }

            renderLayoutNode(layoutRoot);
            stage.innerHTML = `<g class="flow-edges">${edgesSvg.join("")}</g><g class="flow-nodes">${nodesSvg.join("")}</g>`;

            // חיבור לחיצות על קוביות בתרשים לצורך פתיחה/סגירה של ענפים
            stage.querySelectorAll(".flow-node-box.is-expandable").forEach(el => {
                el.addEventListener("click", (e) => {
                    if (flowViewportState.dragMoved) return;
                    e.stopPropagation();
                    const nodeId = el.getAttribute("data-node-id");
                    if (!nodeId || nodeId === "root") return;
                    expandedState[nodeId] = !expandedState[nodeId];
                    renderFlowchartWithData(getCurrentlyDisplayedTree(), false, false);
                });
            });

            updateFlowExpandButtonLabel();
            if (autoFit) {
                fitFlowchartToViewport();
            } else {
                applyFlowTransform();
            }
        }

        function setupFlowchartInteractions() {
            const viewport = document.getElementById("flowchartViewport");
            const viewListBtn = document.getElementById("viewListBtn");
            const viewFlowBtn = document.getElementById("viewFlowBtn");
            const zoomInBtn = document.getElementById("flowZoomInBtn");
            const zoomOutBtn = document.getElementById("flowZoomOutBtn");
            const fitBtn = document.getElementById("flowFitBtn");
            const expandAllBtn = document.getElementById("flowExpandAllBtn");

            if (viewListBtn) viewListBtn.addEventListener("click", () => switchViewMode("list"));
            if (viewFlowBtn) viewFlowBtn.addEventListener("click", () => switchViewMode("flow"));
            if (zoomInBtn) zoomInBtn.addEventListener("click", () => zoomFlowchart(1.22));
            if (zoomOutBtn) zoomOutBtn.addEventListener("click", () => zoomFlowchart(0.82));
            if (fitBtn) fitBtn.addEventListener("click", fitFlowchartToViewport);

            if (expandAllBtn) {
                expandAllBtn.addEventListener("click", () => {
                    const displayed = getCurrentlyDisplayedTree();
                    const shouldCollapse = areAnyFlowNodesExpanded(displayed);
                    setAllExpanded(rawFamilyData, !shouldCollapse);
                    renderFlowchartWithData(getCurrentlyDisplayedTree(), false, true);
                });
            }

            if (viewport) {
                // גרירה באמצעות עכבר ומגע (Pointer Events)
                viewport.addEventListener("pointerdown", (e) => {
                    if (e.button !== 0 && e.pointerType === "mouse") return;
                    flowViewportState.isDragging = true;
                    flowViewportState.dragMoved = false;
                    flowViewportState.startX = e.clientX - flowViewportState.x;
                    flowViewportState.startY = e.clientY - flowViewportState.y;
                });

                window.addEventListener("pointermove", (e) => {
                    if (!flowViewportState.isDragging) return;
                    const nextX = e.clientX - flowViewportState.startX;
                    const nextY = e.clientY - flowViewportState.startY;
                    if (Math.abs(nextX - flowViewportState.x) > 4 || Math.abs(nextY - flowViewportState.y) > 4) {
                        flowViewportState.dragMoved = true;
                    }
                    flowViewportState.x = nextX;
                    flowViewportState.y = nextY;
                    applyFlowTransform();
                });

                window.addEventListener("pointerup", () => {
                    flowViewportState.isDragging = false;
                    setTimeout(() => { flowViewportState.dragMoved = false; }, 30);
                });

                // זום באמצעות גלגלת העכבר
                viewport.addEventListener("wheel", (e) => {
                    e.preventDefault();
                    const factor = e.deltaY < 0 ? 1.12 : 0.89;
                    zoomFlowchart(factor);
                }, { passive: false });
            }
        }

        function setAllExpanded(node, state) {
            if (node.id === "root") {
                expandedState[node.id] = true;
            } else {
                expandedState[node.id] = state;
            }
            if (node.children) {
                node.children.forEach(child => setAllExpanded(child, state));
            }
        }

        // עדכון סרגל הסטטיסטיקה בהתאם לעץ או לענף המוצג כרגע
        function updateStatsBar(dataNode) {
            const stats = calculateStats(dataNode);
            const branchFilter = document.getElementById("branchFilter");
            const isFiltered = branchFilter && branchFilter.value !== "all";
            const totalStats = isFiltered ? calculateStats(rawFamilyData) : stats;

            const totalDescEl = document.getElementById("totalDescendants");
            if (totalDescEl) {
                const hasAnyFilter = isFiltered || currentSearchQuery.trim() !== "";
                if (currentLang === "en") {
                    if (isFiltered) {
                        totalDescEl.innerHTML = `${stats.totalDescendants} descendants in branch <span class="font-normal opacity-90">(of ${totalStats.totalDescendants})</span>`;
                    } else {
                        totalDescEl.textContent = `${stats.totalDescendants} Descendants`;
                    }
                    totalDescEl.title = hasAnyFilter ? "Click to reset filters and show full tree" : "Show full tree";
                } else {
                    if (isFiltered) {
                        totalDescEl.innerHTML = `${stats.totalDescendants} צאצאים בענף <span class="font-normal opacity-90">(מתוך ${totalStats.totalDescendants})</span>`;
                    } else {
                        totalDescEl.textContent = `${stats.totalDescendants} צאצאים`;
                    }
                    totalDescEl.title = hasAnyFilter
                        ? "לחצו לביטול הסינון והצגת כל העץ"
                        : "הצג את כל העץ (מצב ברירת מחדל)";
                }
            }

            const genBreakdownEl = document.getElementById("genBreakdown");
            if (genBreakdownEl) {
                const dotColors = {
                    1: "#2563eb",
                    2: "#16a34a",
                    3: "#d97706",
                    4: "#9333ea",
                    5: "#db2777"
                };
                genBreakdownEl.innerHTML = [1, 2, 3, 4, 5].map(g => {
                    const totalGenSuffix = isFiltered ? `<span class="text-slate-400 font-normal text-[11px] sm:text-xs ms-0.5">(${totalStats.genCounts[g]})</span>` : "";
                    const genLabel = currentLang === "en" ? `Gen ${g}` : `דור ${getHebrewGen(g)}`;
                    return `
                        <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 text-xs sm:text-sm cursor-default ${stats.genCounts[g] === 0 ? 'opacity-45' : ''}">
                            <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${dotColors[g]};" aria-hidden="true"></span>
                            <span class="text-slate-600 font-medium">${genLabel}:</span>
                            <span class="text-slate-900 font-extrabold tabular-nums tracking-tight">${stats.genCounts[g]}${totalGenSuffix}</span>
                        </div>
                    `;
                }).join("");
            }
        }

        function openCenteredPopup(width, height) {
            const dualScreenLeft = window.screenLeft !== undefined ? window.screenLeft : window.screenX;
            const dualScreenTop = window.screenTop !== undefined ? window.screenTop : window.screenY;
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth || screen.width;
            const viewportHeight = window.innerHeight || document.documentElement.clientHeight || screen.height;

            const w = Math.min(width, Math.max(360, viewportWidth - 40));
            const h = Math.min(height, Math.max(400, viewportHeight - 60));
            const left = Math.round(dualScreenLeft + (viewportWidth - w) / 2);
            const top = Math.round(dualScreenTop + (viewportHeight - h) / 2);

            return window.open('', '_blank', `width=${w},height=${h},left=${left},top=${top},scrollbars=yes,resizable=yes`);
        }

        function openPrintWindow() {
            const dataToPrint = getFilteredData();
            const branchFilter = document.getElementById("branchFilter");
            const isEn = currentLang === "en";
            const rawBranchName = branchFilter && branchFilter.value !== "all" && dataToPrint.children && dataToPrint.children[0]
                ? getDisplayName(dataToPrint.children[0]).replace(/^\d+\.\s*/, '').trim()
                : "";
            const branchTitle = rawBranchName
                ? (isEn ? `${escapeHtml(rawBranchName)} Branch` : `ענף משפחת ${escapeHtml(rawBranchName)}`)
                : "";

            const now = new Date();
            const printDateStr = now.toLocaleDateString(isEn ? 'en-GB' : 'he-IL', { year: 'numeric', month: '2-digit', day: '2-digit' });

            function buildPrintHtml(node) {
                const hasChildren = node.children && node.children.length > 0;
                const badgeHtml = node.gen > 0 
                    ? `<span class="print-badge print-badge-gen-${node.gen}">${getHebrewGen(node.gen)}</span>` 
                    : '';
                const titleClass = node.id === 'root' ? 'print-root-title' : 'print-node-title';
                const safePrintName = escapeHtml(getDisplayName(node));
                const formattedPrintName = unboldMaidenNamesInHtml(
                    node.id === 'root'
                        ? safePrintName
                            .replace('(ליפסקר)', '<span style="font-weight: 400;">(ליפסקר)</span>')
                            .replace('(Lipsker)', '<span style="font-weight: 400;">(Lipsker)</span>')
                        : safePrintName
                );
                const safePrintDates = escapeHtml(getDisplayDates(node));
                const safePrintLocation = sanitizeLocationHtml(getDisplayLocation(node));

                let html = `
                    <div class="print-node-wrapper print-gen-${node.gen}">
                        <div class="print-node-item">
                            <div class="print-node-header">
                                ${badgeHtml}

        function stripHtmlTags(html) {
            if (!html) return "";
            const temp = document.createElement("div");
            temp.innerHTML = html;
            return (temp.textContent || temp.innerText || "").replace(/\s+/g, " ").trim();
        }

        function triggerFileDownload(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

                scope: isBranchFiltered ? "filtered_view" : "full_tree",
                tree: targetTree
            };
            const jsonStr = JSON.stringify(payload, null, 2);
            const dateSlug = new Date().toISOString().slice(0, 10);
            const filePrefix = isBranchFiltered ? "fuhrer-family-branch" : "fuhrer-family-tree";

        }

        function exportTreeAsCsv() {
            const isBranchFiltered = document.getElementById("branchFilter")?.value !== "all" || currentSearchQuery.trim() !== "";
            const targetTree = getCurrentlyDisplayedTree();
            const rows = [
                ["מזהה", "דור", "תווית דור", "שם מלא", "הורה / ענף אב", "תאריכים ואירועים", "מיקום גיאוגרפי"]
            ];

            function traverse(node, parentName) {
                const genLabel = node.gen === 0 ? "שורש" : `דור ${getHebrewGen(node.gen)}`;
                rows.push([
                    node.id || "",
                    node.gen !== undefined ? String(node.gen) : "",
                    genLabel,
                    stripHtmlTags(node.name || ""),
                    stripHtmlTags(parentName || ""),
                    stripHtmlTags(node.dates || ""),
                    stripHtmlTags(node.location || "")
                ]);
                if (node.children && node.children.length > 0) {
                    node.children.forEach(child => traverse(child, node.name));
                }
            }

            traverse(targetTree, "");

            const csvContent = "\uFEFF" + rows.map(row =>
                row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")
            ).join("\r\n");

            const dateSlug = new Date().toISOString().slice(0, 10);
            const filePrefix = isBranchFiltered ? "fuhrer-family-branch" : "fuhrer-family-tree";
            triggerFileDownload(csvContent, `${filePrefix}-${dateSlug}.csv`, "text/csv;charset=utf-8");
        }

        // המרת עץ הנתונים לפורמט GEDCOM 5.5.1 תקני (לשיתוף וייבוא ב-MyHeritage, Geni ותוכנות גנאלוגיה)
        function exportTreeAsGedcom() {
            const isBranchFiltered = document.getElementById("branchFilter")?.value !== "all" || currentSearchQuery.trim() !== "";
            const targetTree = getCurrentlyDisplayedTree();
            const lines = [
                "0 HEAD",
                "1 SOUR FUHRER_FAMILY_TREE",
                "2 NAME Fuhrer Family Genealogy Web App",
                "1 GEDC",
                "2 VERS 5.5.1",
                "2 FORM LINEAGE-LINKED",
                "1 CHAR UTF-8"
            ];

            let indiCounter = 1;
            let famCounter = 1;

            function extractYear(datesStr, keyword) {
                if (!datesStr) return "";
                const kwRegex = new RegExp(`${keyword}[^|]*?(\\d{4})`);
                const kwMatch = datesStr.match(kwRegex);
                if (kwMatch) return kwMatch[1];
                const rangeMatch = datesStr.match(/(\d{4})\s*[-–]\s*(\d{4})/);
                if (rangeMatch) {
                    return keyword === "פטירה" ? rangeMatch[2] : rangeMatch[1];
                }
                if (keyword === "לידה") {
                    const anyYear = datesStr.match(/\b(18\d{2}|19\d{2}|20\d{2})\b/);
                    if (anyYear && !datesStr.includes("פטירה") && !datesStr.includes("נישואין")) {
                        return anyYear[1];
                    }
                }
                return "";
            }

            // פיצול שם זוגי ("X וY משפחה") לשני פרטים נפרדים עבור מבנה FAM ב-GEDCOM
            function parseCoupleOrIndividual(rawName) {
                const clean = stripHtmlTags(rawName).replace(/^\d+\.\s*/, "").trim();
                const coupleMatch = clean.match(/^(.+?)\s+ו([^\s].+)$/);
                if (coupleMatch) {
                    const part1 = coupleMatch[1].trim();
                    const part2 = coupleMatch[2].trim();
                    const p2Words = part2.split(" ");
                    const surname = p2Words.length > 1 ? p2Words[p2Words.length - 1] : "";
                    const p1HasSurname = part1.split(" ").length > 1 && surname && part1.endsWith(surname);
                    const person1Name = (surname && !p1HasSurname) ? `${part1} /${surname}/` : part1;
                    const person2Name = surname ? `${p2Words.slice(0, -1).join(" ")} /${surname}/` : part2;
                    return { isCouple: true, person1Name, person2Name };
                }
                const words = clean.split(" ");
                const formatted = words.length > 1
                    ? `${words.slice(0, -1).join(" ")} /${words[words.length - 1]}/`
                    : clean;
                return { isCouple: false, person1Name: formatted };
            }

            function processNode(node, parentFamId) {
                const parsed = parseCoupleOrIndividual(node.name);
                const cleanDates = stripHtmlTags(node.dates || "");
                const cleanLoc = stripHtmlTags(node.location || "");
                const birthYear = extractYear(cleanDates, "לידה");
                const deathYear = extractYear(cleanDates, "פטירה");
                const marrYear = extractYear(cleanDates, "נישואין");

                const indi1Id = `@I${indiCounter++}@`;
                lines.push(`0 ${indi1Id} INDI`);
                lines.push(`1 NAME ${parsed.person1Name}`);
                if (parentFamId) lines.push(`1 FAMC ${parentFamId}`);
                if (birthYear) {
                    lines.push("1 BIRT");
                    lines.push(`2 DATE ${birthYear}`);
                }
                if (deathYear || cleanNameHasMemorial(node.name)) {
                    lines.push("1 DEAT Y");
                    if (deathYear) lines.push(`2 DATE ${deathYear}`);
                }
                if (cleanLoc) lines.push(`1 NOTE מיקום: ${cleanLoc}`);
                if (cleanDates) lines.push(`1 NOTE פרטים: ${cleanDates}`);

                let indi2Id = null;
                if (parsed.isCouple) {
                    indi2Id = `@I${indiCounter++}@`;
                    lines.push(`0 ${indi2Id} INDI`);
                    lines.push(`1 NAME ${parsed.person2Name}`);
                }

                const hasChildren = node.children && node.children.length > 0;
                if (parsed.isCouple || hasChildren) {
                    const famId = `@F${famCounter++}@`;
                    lines.push(`1 FAMS ${famId}`);
                    // עדכון הפניית FAMS גם לבן/בת הזוג הראשון
                    const indi1InsertIdx = lines.lastIndexOf(`0 ${indi1Id} INDI`) + 2;
                    lines.splice(indi1InsertIdx, 0, `1 FAMS ${famId}`);

                    const childIds = [];
                    if (hasChildren) {
                        node.children.forEach(child => {
                            const childPrimaryId = processNode(child, famId);
                            if (childPrimaryId) childIds.push(childPrimaryId);
                        });
                    }

                    lines.push(`0 ${famId} FAM`);
                    lines.push(`1 HUSB ${indi1Id}`);
                    if (indi2Id) lines.push(`1 WIFE ${indi2Id}`);
                    if (marrYear) {
                        lines.push("1 MARR");
                        lines.push(`2 DATE ${marrYear}`);
                    }
                    childIds.forEach(cid => lines.push(`1 CHIL ${cid}`));
                }

                return indi1Id;
            }

            function cleanNameHasMemorial(name) {
                return /ז"ל|הי"ד/.test(name || "");
            }

            processNode(targetTree, null);
            lines.push("0 TRLR");

            const gedcomContent = lines.join("\r\n");
            const dateSlug = new Date().toISOString().slice(0, 10);
            const filePrefix = isBranchFiltered ? "fuhrer-family-branch" : "fuhrer-family-tree";
            triggerFileDownload(gedcomContent, `${filePrefix}-${dateSlug}.ged`, "text/plain;charset=utf-8");
        }

        // אתחול האפליקציה עם טעינת העמוד
        document.addEventListener("DOMContentLoaded", async () => {
            await tryLoadExternalJsonData();

            let initialLang = "he";
            try {
                if (localStorage.getItem("fuhrer_tree_lang") === "en") initialLang = "en";
            } catch (e) {
                // התעלמות משגיאת גישה ל-localStorage
            }
            applyLanguageUI(initialLang, false);

            initInitialState(rawFamilyData);
            applyFiltersAndRender();
            setupBranchFilter();
            setupSearch();
            setupFlowchartInteractions();

            const langToggleBtn = document.getElementById("langToggleBtn");
            if (langToggleBtn) {
                langToggleBtn.addEventListener("click", toggleLanguage);
            }

            // איפוס מלא וחזרה לדף הנחיתה הראשי בלחיצה על לוגו העץ או כפתור ספירת הצאצאים
            function resetToLandingPage() {
                const branchFilter = document.getElementById("branchFilter");
                const searchInput = document.getElementById("searchInput");
                const clearSearchBtn = document.getElementById("clearSearchBtn");

                if (branchFilter) branchFilter.value = "all";
                if (searchInput) searchInput.value = "";
                if (clearSearchBtn) clearSearchBtn.classList.add("hidden");

                currentSearchQuery = "";
                savedExpandedStateBeforeFilter = null;
                savedToldotStateBeforeFilter = null;
                isToldotExpanded = false;

                initInitialState(rawFamilyData);
                applyFiltersAndRender();
                window.scrollTo({ top: 0, behavior: "smooth" });
            }

            const homeLogoBtn = document.getElementById("homeLogoBtn");
            if (homeLogoBtn) {
                homeLogoBtn.addEventListener("click", resetToLandingPage);
            }

            const totalDescendantsBtn = document.getElementById("totalDescendants");
            if (totalDescendantsBtn) {
                totalDescendantsBtn.addEventListener("click", resetToLandingPage);
            }

            const bannerResetBtn = document.getElementById("bannerResetBtn");
            if (bannerResetBtn) {
                bannerResetBtn.addEventListener("click", resetToLandingPage);
            }

            const toldotSearchIndicator = document.getElementById("toldotSearchIndicator");
            if (toldotSearchIndicator) {
                toldotSearchIndicator.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (!isToldotExpanded) {
                        toggleToldot();
                    }
                    const toldotEl = document.getElementById(currentViewMode === "flow" ? "flowToldotContent" : "rootToldotContent");
                    if (toldotEl) {
                        toldotEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
                    }
                });
            }

            const printBtn = document.getElementById("printTreeBtn");
            if (printBtn) {
                printBtn.addEventListener("click", openPrintWindow);
            }

            const exportJsonBtn = document.getElementById("exportJsonBtn");
            if (exportJsonBtn) {
                exportJsonBtn.addEventListener("click", exportTreeAsJson);
            }

            const exportCsvBtn = document.getElementById("exportCsvBtn");
            if (exportCsvBtn) {
                exportCsvBtn.addEventListener("click", exportTreeAsCsv);
            }

            const exportGedcomBtn = document.getElementById("exportGedcomBtn");
            if (exportGedcomBtn) {
                exportGedcomBtn.addEventListener("click", exportTreeAsGedcom);
            }

            // כפתור צף לחזרה מהירה לראש העמוד בעת גלילה מטה
            const backToTopBtn = document.getElementById("backToTopBtn");
            if (backToTopBtn) {
                window.addEventListener("scroll", () => {
                    if (window.scrollY > 360) {
                        backToTopBtn.classList.remove("hidden");
                    } else {
                        backToTopBtn.classList.add("hidden");
                    }
                }, { passive: true });

                backToTopBtn.addEventListener("click", () => {
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });
            }

            // קיצור מקלדת Escape לסגירת חלונית התמונה, חלונית תולדות או ניקוי החיפוש
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    const portraitModal = document.getElementById("portraitModal");
                    if (portraitModal) {
                        portraitModal.remove();
                        return;
                    }
                    if (isToldotExpanded) {
                        toggleToldot();
                        return;
                    }
                    const searchInput = document.getElementById("searchInput");
                    const clearSearchBtn = document.getElementById("clearSearchBtn");
                    if (searchInput && searchInput.value.trim() !== "") {
                        searchInput.value = "";
                        currentSearchQuery = "";
                        if (clearSearchBtn) clearSearchBtn.classList.add("hidden");
                        applyFiltersAndRender();
                    }
                }
            });
        });
    </script>
</body>
</html>
